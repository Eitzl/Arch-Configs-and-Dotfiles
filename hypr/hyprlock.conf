# hyprlang syntax: hyprlock did not move to Lua.
# Oxide §08. Colors come from Noctalia (noctalia/templates/hyprlock-colors.conf,
# rendered to hyprlock-colors.conf next to this file). The Oxide values below
# are fallbacks for before Noctalia has rendered it; the source overrides them.

$surface            = rgb(08080A)
$text               = rgb(C9C6C0)
$muted              = rgb(8A8780)
$outline            = rgb(2A2A30)
$primary            = rgb(D9543A)
$error              = rgb(FF3B30)
$field_fill         = rgba(08080A66)
$faint_text         = rgba(8A878066)
$bracket            = rgba(D9543A55)

source = ~/.config/hypr/hyprlock-colors.conf

$mono    = JetBrainsMono Nerd Font
# Archivo at wdth 118 / wght 800. Pango reads the whole string as a font
# description, so it falls back to JetBrainsMono ExtraBold until Archivo
# (ttf-archivo) is installed.
$display = Archivo, JetBrainsMono Nerd Font ExtraBold @wdth=118,wght=800

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# States: idle = outline, checking = on_surface_variant (dimmer on purpose:
# the machine is thinking, not celebrating), fail = error. All solid, 2px.
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    rounding = 2
    inner_color = $field_fill

    outer_color = $outline
    check_color = $muted
    fail_color = $error

    font_color = $text
    font_family = $mono
    fade_on_empty = false

    placeholder_text = ▪  PASSWORD
    check_text = ▪  VERIFYING
    fail_text = ✕  AUTHENTICATION FAILED · ATTEMPT $ATTEMPTS

    # A fixed-width asterisk run instead of dots, so length reads at a glance.
    dots_text_format = *
    dots_spacing = 0.16
    dots_center = false

    position = 0, -20
    halign = center
    valign = center
}

# Clock, top right.
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $display
    color = $text

    position = -52, -44
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" | tr '[:lower:]' '[:upper:]'
    font_size = 22
    font_family = $mono
    color = $muted

    position = -52, -190
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:0] sed 's/.*/\U& · SESSION LOCKED/' /etc/hostname
    font_size = 17
    font_family = $mono
    color = $faint_text

    position = -52, -228
    halign = right
    valign = top
}

# Part number, bottom left.
label {
    monitor =
    text = REF OXIDE-T6<br/>LOT 7536U-141-777
    font_size = 16
    font_family = $mono
    color = $faint_text

    position = 52, 48
    halign = left
    valign = bottom
}

# Corner brackets: top-left and bottom-right, 44px arms, 2px, dim oxide.
shape {
    monitor =
    size = 44, 2
    color = $bracket
    rounding = 0
    position = 52, -52
    halign = left
    valign = top
}

shape {
    monitor =
    size = 2, 44
    color = $bracket
    rounding = 0
    position = 52, -52
    halign = left
    valign = top
}

shape {
    monitor =
    size = 44, 2
    color = $bracket
    rounding = 0
    position = -52, 52
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 2, 44
    color = $bracket
    rounding = 0
    position = -52, 52
    halign = right
    valign = bottom
}
