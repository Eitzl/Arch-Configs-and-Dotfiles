# Oxide §05: the one custom template. Noctalia renders this to
# ~/.config/hypr/hyprlock-colors.conf whenever the palette changes, and
# hyprlock.conf sources it. Six roles, nothing else ($text = on_surface,
# $muted = on_surface_variant; renamed so no name is a prefix of another).
# Generated by Noctalia - do not edit the rendered copy.

$surface            = rgb({{colors.surface.default.hex_stripped}})
$text               = rgb({{colors.on_surface.default.hex_stripped}})
$muted              = rgb({{colors.on_surface_variant.default.hex_stripped}})
$outline            = rgb({{colors.outline.default.hex_stripped}})
$primary            = rgb({{colors.primary.default.hex_stripped}})
$error              = rgb({{colors.error.default.hex_stripped}})

# Alpha variants for the dim furniture (host line, serial, corner brackets).
$field_fill         = rgba({{colors.surface.default.hex_stripped}}66)
$faint_text         = rgba({{colors.on_surface_variant.default.hex_stripped}}66)
$bracket            = rgba({{colors.primary.default.hex_stripped}}55)
